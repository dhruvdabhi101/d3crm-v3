services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: d3crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - d3crm_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d d3crm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  d3crm_postgres:
